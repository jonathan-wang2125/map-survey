<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Explorer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           margin: 0; background: #f6f7fb; color: #1c2430; }
    header { padding: 14px 24px; background: #1c2430; color: #fff;
             display: flex; align-items: baseline; gap: 16px; }
    header h1 { font-size: 18px; margin: 0; }
    header .sub { color: #9fb0c9; font-size: 13px; }
    #totals { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 24px 0; }
    .pill { background: #fff; border: 1px solid #dde3ee; border-radius: 20px;
            padding: 5px 14px; font-size: 13px; }
    .pill b { color: #2456d6; }
    #graph-wrap { overflow: auto; padding: 10px 24px 40px; }
    svg { display: block; }
    .edge { fill: none; stroke: #b9c4d8; stroke-width: 1.5; }
    .node rect { fill: #fff; stroke: #b9c4d8; stroke-width: 1.2; rx: 8;
                 transition: stroke .12s, filter .12s; }
    .node.clickable { cursor: pointer; }
    .node.clickable:hover rect { stroke: #2456d6; filter: drop-shadow(0 2px 5px rgba(36,86,214,.25)); }
    .node text.title { font-size: 13px; font-weight: 600; fill: #1c2430; }
    .node text.count { font-size: 11.5px; fill: #5a6a82; }
    .node.root rect { fill: #1c2430; stroke: #1c2430; }
    .node.root text { fill: #fff; }
    .node.campaign rect { fill: #eef3ff; stroke: #9db4e8; }
    #err { color: #b00020; padding: 20px 24px; }
    #recent-bar { padding: 12px 24px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #recent-bar button, #recent-bar select, #recent-bar input {
      font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid #dde3ee;
      border-radius: 6px; background: #fff; color: #1c2430; cursor: pointer; }
    #recent-bar button.primary { background: #2456d6; border-color: #2456d6; color: #fff; }
    #recent-bar input { width: 70px; cursor: text; }
    #recent-panel { margin: 12px 24px 0; background: #fff; border: 1px solid #dde3ee;
                    border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
    #recent-panel .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    #recent-panel table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
    #recent-panel th, #recent-panel td { text-align: left; padding: 5px 10px;
                    border-bottom: 1px solid #eef1f7; vertical-align: top; }
    #recent-panel th { color: #5a6a82; font-weight: 600; white-space: nowrap; }
    #recent-panel td.when { white-space: nowrap; color: #5a6a82; }
    #recent-panel .ev { border-radius: 10px; padding: 1px 8px; font-size: 11.5px; white-space: nowrap; }
    #recent-panel .ev.created { background: #e6f4ea; color: #14632a; }
    #recent-panel .ev.edited { background: #fff3d6; color: #7a5300; }
    #recent-panel .ev.adjudicated, #recent-panel .ev.requested { background: #eef3ff; color: #2456d6; }
    #recent-panel .tag { background: #f1e6ff; color: #5b2ba6; border-radius: 10px;
                    padding: 1px 8px; font-size: 11px; white-space: nowrap; }
    #recent-panel .muted { color: #8b98ab; }
    #recent-note { font-size: 12px; color: #8b98ab; margin-top: 8px; }
    #recent-panel .pill.clickable { cursor: pointer; user-select: none; }
    #recent-panel .pill.clickable:hover { border-color: #2456d6; }
    #recent-panel .pill.active { background: #2456d6; border-color: #2456d6; color: #fff; }
    #recent-panel .pill.active b { color: #fff; }
    #recent-panel th.sortable { cursor: pointer; user-select: none; }
    #recent-panel th.sortable:hover { color: #2456d6; }
  </style>
</head>
<body>
  <header>
    <h1>Redis Database Explorer</h1>
    <span class="sub">read-only &middot; click any node to open its data</span>
    <span class="sub" id="stamp"></span>
  </header>
  <div id="totals"></div>
  <div id="recent-bar">
    <button id="recent-toggle" class="primary">Recent changes</button>
    <span id="recent-controls" style="display:none">
      <select id="recent-preset">
        <option value="1">last hour</option>
        <option value="6">last 6 hours</option>
        <option value="24" selected>last 24 hours</option>
        <option value="48">last 48 hours</option>
        <option value="168">last 7 days</option>
        <option value="720">last 30 days</option>
        <option value="custom">custom…</option>
      </select>
      <input id="recent-hours" type="number" min="0.1" step="1" value="24"
             title="hours" style="display:none">
      <button id="recent-refresh">refresh</button>
    </span>
  </div>
  <div id="recent-panel" style="display:none"></div>
  <div id="err"></div>
  <div id="graph-wrap"><svg id="graph"></svg></div>

<script>
const nodeURL = (type, id, extra) => {
  const p = new URLSearchParams({ type, ...(id !== undefined ? { id } : {}), ...(extra || {}) });
  return `/database_node.html?${p}`;
};
const fmt = n => n.toLocaleString('en-US');

async function main() {
  let o;
  try {
    const r = await fetch('/api/db/overview');
    o = await r.json();
    if (o.error) throw new Error(o.error);
  } catch (e) {
    document.getElementById('err').textContent = 'Failed to load overview: ' + e;
    return;
  }
  document.getElementById('stamp').textContent = 'index built ' + o.generatedAt;
  const t = o.totals;
  document.getElementById('totals').innerHTML = [
    ['keys', t.keys], ['users', t.users], ['datasets', t.datasets],
    ['questions', t.questions], ['answers', t.answers],
    ['past adjudications', t.pastAdjudications],
  ].map(([k, v]) => `<span class="pill"><b>${fmt(v)}</b> ${k}</span>`).join('');

  /* ---- build tree ---- */
  const root = {
    title: 'MapQA Redis DB', count: `${fmt(t.keys)} keys`, cls: 'root',
    url: null, children: [],
  };
  root.children.push({
    title: 'Users', count: `${t.users} total, ${t.activeUsers} with answers`,
    url: nodeURL('users'), children: [],
  });
  for (const c of o.campaigns) {
    const fams = o.families.filter(f => f.campaign === c.topic);
    root.children.push({
      title: `Campaign: ${c.topic}`, cls: 'campaign',
      count: `${fmt(c.datasetCount)} datasets` +
             (c.meta && c.meta.curIndex !== undefined ? ` · curIndex ${c.meta.curIndex}` : ''),
      url: nodeURL('campaign', c.topic),
      children: fams.map(f => ({
        title: f.family,
        count: `${fmt(f.datasets)} ds · ${fmt(f.questions)} q · ${fmt(f.answers)} ans`,
        url: nodeURL('family', f.family), children: [],
      })),
    });
  }
  const orphans = o.families.filter(f => f.campaign === '(no campaign)');
  if (orphans.length) {
    root.children.push({
      title: 'No campaign', count: `${orphans.length} families`, url: null,
      children: orphans.map(f => ({
        title: f.family,
        count: `${fmt(f.datasets)} ds · ${fmt(f.questions)} q · ${fmt(f.answers)} ans`,
        url: nodeURL('family', f.family), children: [],
      })),
    });
  }
  root.children.push({
    title: 'Adjudications',
    count: `${fmt(t.pastAdjudications)} past · ${fmt(t.pendingAdjudications)} pending`,
    url: nodeURL('adjudications'), children: [],
  });
  root.children.push({
    title: 'Counters', count: `${o.counters.length} keys`,
    url: null,
    children: o.counters.map(k => ({
      title: k.replace(/^v1:/, ''), count: 'INCR counter',
      url: nodeURL('key', undefined, { key: k }), children: [],
    })),
  });

  drawTree(root);
}

/* ---- simple left-to-right tidy tree ---- */
const NODE_W = 300, NODE_H = 46, X_GAP = 90, Y_GAP = 14, PAD = 20;

function layout(node, depth, state) {
  node.depth = depth;
  if (!node.children.length) {
    node.y = state.nextY;
    state.nextY += NODE_H + Y_GAP;
  } else {
    for (const c of node.children) layout(c, depth + 1, state);
    node.y = (node.children[0].y + node.children[node.children.length - 1].y) / 2;
  }
  node.x = PAD + depth * (NODE_W + X_GAP);
}

function drawTree(root) {
  const state = { nextY: PAD };
  layout(root, 0, state);
  const svg = document.getElementById('graph');
  const ns = 'http://www.w3.org/2000/svg';
  let maxDepth = 0;
  const flat = [];
  (function walk(n) { flat.push(n); maxDepth = Math.max(maxDepth, n.depth);
                      n.children.forEach(walk); })(root);
  svg.setAttribute('width', PAD * 2 + (maxDepth + 1) * NODE_W + maxDepth * X_GAP);
  svg.setAttribute('height', state.nextY + PAD);

  for (const n of flat) {
    for (const c of n.children) {
      const p = document.createElementNS(ns, 'path');
      const x1 = n.x + NODE_W, y1 = n.y + NODE_H / 2,
            x2 = c.x, y2 = c.y + NODE_H / 2, mx = (x1 + x2) / 2;
      p.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
      p.setAttribute('class', 'edge');
      svg.appendChild(p);
    }
  }
  for (const n of flat) {
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', `node ${n.cls || ''} ${n.url ? 'clickable' : ''}`);
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('width', NODE_W); rect.setAttribute('height', NODE_H);
    rect.setAttribute('rx', 8);
    g.appendChild(rect);
    const t1 = document.createElementNS(ns, 'text');
    t1.setAttribute('x', 12); t1.setAttribute('y', 19); t1.setAttribute('class', 'title');
    t1.textContent = n.title;
    g.appendChild(t1);
    const t2 = document.createElementNS(ns, 'text');
    t2.setAttribute('x', 12); t2.setAttribute('y', 36); t2.setAttribute('class', 'count');
    t2.textContent = n.count || '';
    g.appendChild(t2);
    if (n.url) g.addEventListener('click', () => { window.location.href = n.url; });
    svg.appendChild(g);
  }
}

/* ---- recent changes panel (answer-record activity) ---- */
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const evCls = { 'created': 'created', 'edited': 'edited',
                'adjudicated': 'adjudicated', 'adjudication requested': 'requested' };

const recentState = { filter: null, sortCol: null, sortDir: 1, data: null };
const RECENT_COLS = [
  ['when', e => e.ts], ['event', e => e.event], ['user', e => e.pid],
  ['dataset', e => e.ds], ['question', e => e.uid],
  ['answer', e => String(e.answer ?? '')],
];

function recentHours() {
  const preset = document.getElementById('recent-preset').value;
  return preset === 'custom'
    ? parseFloat(document.getElementById('recent-hours').value) || 24
    : parseFloat(preset);
}

async function loadRecent() {
  const panel = document.getElementById('recent-panel');
  panel.style.display = '';
  panel.innerHTML = '<span class="muted">loading…</span>';
  let d;
  try {
    const q = new URLSearchParams({ hours: recentHours() });
    if (recentState.filter) q.set('event', recentState.filter);
    const r = await fetch('/api/db/recent?' + q);
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    panel.innerHTML = '<span style="color:#b00020">Failed: ' + esc(e) + '</span>';
    return;
  }
  recentState.filter = d.filter;   // server echoes the applied filter (null if invalid)
  recentState.data = d;
  renderRecent();
}

function toggleRecentFilter(ev) {
  recentState.filter = recentState.filter === ev ? null : ev;
  loadRecent();
}

function cycleRecentSort(col) {
  if (recentState.sortCol !== col) { recentState.sortCol = col; recentState.sortDir = 1; }
  else if (recentState.sortDir === 1) recentState.sortDir = -1;
  else { recentState.sortCol = null; recentState.sortDir = 1; }   // third click cancels
  renderRecent();
}

function renderRecent() {
  const d = recentState.data, panel = document.getElementById('recent-panel');
  const by = d.byEvent || {};
  const evPill = (name, n) =>
    `<span class="pill clickable ${recentState.filter === name ? 'active' : ''}"
           data-ev="${esc(name)}"><b>${fmt(n)}</b> ${esc(name)}</span>`;
  const pillsHtml =
    `<span class="pill"><b>${fmt(d.grandTotal)}</b> events</span>` +
    evPill('created', by['created'] || 0) + evPill('edited', by['edited'] || 0) +
    evPill('adjudicated', by['adjudicated'] || 0) +
    (by['adjudication requested'] ? evPill('adjudication requested', by['adjudication requested']) : '') +
    `<span class="pill"><b>${fmt(Object.keys(d.byDataset || {}).length)}</b> datasets touched</span>` +
    `<span class="pill"><b>${fmt(Object.keys(d.byUser || {}).length)}</b> users active</span>`;

  let events = d.events;
  if (recentState.sortCol !== null) {
    const key = RECENT_COLS.find(([c]) => c === recentState.sortCol)[1];
    events = [...events].sort((a, b) => {
      const x = key(a), y = key(b);
      const cmp = typeof x === 'number'
        ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true });
      return recentState.sortDir * cmp;
    });
  }
  const headers = RECENT_COLS.map(([c]) => {
    const arrow = recentState.sortCol === c ? (recentState.sortDir === 1 ? ' ▲' : ' ▼') : '';
    return `<th class="sortable" data-col="${c}" title="click to sort / reverse / reset">${esc(c)}${arrow}</th>`;
  }).join('');
  const rows = events.map(e => `<tr>
    <td class="when">${new Date(e.ts).toLocaleString()}</td>
    <td><span class="ev ${evCls[e.event] || ''}">${esc(e.event)}</span></td>
    <td><a href="${nodeURL('user', e.pid)}">${esc(e.pid)}</a></td>
    <td><a href="${nodeURL('dataset', e.ds)}">${esc(e.ds)}</a></td>
    <td><a href="${nodeURL('question', e.ds, { uid: e.uid })}" title="${esc(e.uid)}">${esc(e.uid.slice(0, 8))}…</a></td>
    <td>${esc(e.answer)}${e.badQuestion ? ' <span class="tag">bad q</span>' : ''}${
        e.adjudication ? ` <span class="tag">adj: ${esc(e.adjudication)}</span>` : ''}${
        e.source ? ` <span class="tag" title="${esc(e.source)}">import</span>` : ''}</td>
  </tr>`).join('');
  panel.innerHTML =
    `<div class="pillrow">${pillsHtml}</div>` +
    (d.total === 0
      ? `<span class="muted">No ${recentState.filter ? `"${esc(recentState.filter)}" ` : ''}answer activity in this window.</span>`
      : `<table><tr>${headers}</tr>${rows}</table>`) +
    (d.truncated ? `<div id="recent-note">showing newest ${fmt(d.events.length)} of ${fmt(d.total)}${
        recentState.filter ? ` "${esc(recentState.filter)}"` : ''} events — narrow the window to see the rest</div>` : '') +
    `<div id="recent-note">${esc(d.note)} · scanned ${fmt(d.answersScanned)} answers · index built ${esc(d.generatedAt)}</div>`;
  panel.querySelectorAll('.pill.clickable').forEach(el =>
    el.addEventListener('click', () => toggleRecentFilter(el.dataset.ev)));
  panel.querySelectorAll('th.sortable').forEach(el =>
    el.addEventListener('click', () => cycleRecentSort(el.dataset.col)));
}

document.getElementById('recent-toggle').addEventListener('click', () => {
  const panel = document.getElementById('recent-panel');
  const controls = document.getElementById('recent-controls');
  const open = panel.style.display === 'none';
  controls.style.display = open ? '' : 'none';
  panel.style.display = open ? '' : 'none';
  if (open) loadRecent();
});
document.getElementById('recent-preset').addEventListener('change', () => {
  document.getElementById('recent-hours').style.display =
    document.getElementById('recent-preset').value === 'custom' ? '' : 'none';
  loadRecent();
});
document.getElementById('recent-hours').addEventListener('change', loadRecent);
document.getElementById('recent-refresh').addEventListener('click', loadRecent);

main();
</script>
</body>
</html>
